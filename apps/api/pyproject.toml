[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "cloudinary>=1.46.3",
    "fastapi[standard]>=0.143.0",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
extend-exclude = ["src/alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
